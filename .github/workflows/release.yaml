name: Build and Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Create Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Test
        run: |
          go vet ./...
          go test -race ./...

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r '"v\(.version_major).\(.version_minor).\(.version_patch)"' .introspect)"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $version"

      - name: Check whether release exists
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $VERSION already exists; nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release binaries
        if: steps.release.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          for target in linux/386 linux/amd64 linux/arm linux/arm64 linux/mipsle linux/riscv64 windows/amd64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            output="build/zoraxy-path-access-control_${goos}_${goarch}"
            if [[ "$goos" == "windows" ]]; then
              output="${output}.exe"
            fi
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build \
              -buildvcs=false -trimpath -ldflags="-s -w" -o "$output" .
          done
          sha256sum build/zoraxy-path-access-control_* > build/SHA256SUMS

      - name: Create GitHub release
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" build/* \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes
